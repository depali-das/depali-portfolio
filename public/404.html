<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09080d" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found — Depali Das</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        place-items: center;
        background: radial-gradient(ellipse at 50% 40%, rgba(84, 43, 134, .26), transparent 54%), linear-gradient(130deg, #090d19, #100d1c 62%, #0b0a16);
        color: #f7f5f9;
        font-family: "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 520px; }
      .code { margin: 0; color: #c7a6eb; font-size: clamp(80px, 20vw, 150px); line-height: 1; }
      h1 { margin: 18px 0 10px; font-size: clamp(27px, 6vw, 42px); letter-spacing: -.045em; }
      main > p:not(.code) { margin: 0 0 26px; color: #aaa5b2; font-size: 14px; line-height: 1.8; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 18px; border-radius: 3px; background: linear-gradient(110deg, #a276d1, #8159b0); color: white; font-size: 12px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #d5affb; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page wandered off.</h1>
      <p>The address may be outdated, or the page may have moved.</p>
      <a href="/">Return to portfolio</a>
    </main>
  </body>
</html>
