    <link
      rel="preload"
      as="image"
      href="/images/depali-optimized.jpg"
      imagesrcset="/images/depali-400.jpg 400w, /images/depali-optimized.jpg 640w"
      imagesizes="(max-width: 640px) 360px, (max-width: 1023px) 320px, 350px"
      fetchpriority="high"

    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"

    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap"
      />

    <meta
      name="description"
      content="Depali Das is an aspiring frontend developer creating beautiful, responsive and user-friendly websites."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#09080d" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('dipali-portfolio-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#09080d' : '#f7f5fa');
        } catch {
          const theme = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#09080d' : '#f7f5fa');
        }
      })();
    </script>
